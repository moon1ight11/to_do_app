services:
  postgres:
    image: postgres:15-alpine
    restart: always
    hostname: myPostgres
    environment:
      - POSTGRES_USER=fedor
      - POSTGRES_PASSWORD=fedor_pass
      - POSTGRES_DB=todoapp
    ports:
      - 15432:5432
    volumes:
      - ./temp_files/postgresql_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
