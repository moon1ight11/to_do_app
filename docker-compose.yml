services:
  postgres:
    image: postgres:15-alpine
    restart: always
    hostname: myPostgres
    environment:
      - POSTGRES_USER=fedor
      - POSTGRES_PASSWORD=fedor_pass
      - POSTGRES_DB=todoapp
    ports:
      - 15432:5432
    volumes:
      - ./temp_files/postgresql_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped

volumes:
  redis_data:
