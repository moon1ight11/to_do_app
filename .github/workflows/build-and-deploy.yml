name: Build and API

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ moon1ight11 }}
          password: ${{ ***REMOVED*** }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          file: ./df/api.df
          push: true
          tags: "ghcr.io/${{ to-do-ers }}/${{ to-do_app }}-api:latest"